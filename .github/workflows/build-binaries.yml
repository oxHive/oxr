name: Build binaries

# oxr is distributed by committing prebuilt binaries into dist/ (see
# action.yml) rather than as GitHub Release assets, so a floating tag moves
# the binary a consumer picks up with zero extra machinery. This workflow
# rebuilds all target binaries and commits any changes straight to the
# branch that triggered it.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - dist: Linux-X64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - dist: Linux-ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - dist: macOS-ARM64
            os: macos-14
            target: aarch64-apple-darwin
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/oxr

      - uses: actions/upload-artifact@v4
        with:
          name: oxr-${{ matrix.dist }}
          path: target/${{ matrix.target }}/release/oxr
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Arrange into dist/
        run: |
          set -euo pipefail
          for dir in artifacts/oxr-*; do
            name="$(basename "$dir" | sed 's/^oxr-//')"
            mkdir -p "dist/$name"
            cp "$dir/oxr" "dist/$name/oxr"
            chmod +x "dist/$name/oxr"
          done

      - name: Commit updated binaries
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "no binary changes to commit"
            exit 0
          fi
          git commit -m "chore: rebuild oxr binaries"
          git push
