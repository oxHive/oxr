name: 'oxr'
description: 'Install the oxr semantic-version bump and git-tag orchestrator onto PATH'
branding:
  icon: 'tag'
  color: 'blue'

runs:
  using: "composite"
  steps:
    - name: Add oxr to PATH
      shell: bash
      run: |
        set -euo pipefail
        DIST_DIR="${{ github.action_path }}/dist/${{ runner.os }}-${{ runner.arch }}"
        BIN="$DIST_DIR/oxr"

        if [ ! -f "$BIN" ]; then
          echo "::error::oxr has no prebuilt binary for ${{ runner.os }}-${{ runner.arch }}. Supported platforms: Linux-X64, Linux-ARM64, macOS-ARM64. See dist/ in the oxr repo." >&2
          exit 1
        fi

        chmod +x "$BIN"
        echo "$DIST_DIR" >> "$GITHUB_PATH"
